name: CI Pipeline - Trabalho 5

# Gatilho (Trigger): Executa em push ou pull request na branch main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configuração do ambiente (Exemplo com Node.js; ajuste conforme a sua linguagem)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Recomendado: Cache de dependências

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Análise Estática / Lint (Recomendado)
      - name: Executar Lint
        run: npm run lint --if-present

      # 5. Executar Testes
      - name: Executar Testes
        run: npm test

      # 6. Build da Aplicação
      - name: Executar Build
        run: npm run build

      # 7. Gerar e Salvar Artefato
      - name: Upload do Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.sha }}
          path: dist/ # Ou a pasta de saída do seu build (ex: build/, bin/, target/)
